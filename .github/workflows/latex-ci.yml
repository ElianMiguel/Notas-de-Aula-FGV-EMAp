name: Compilação de LaTeX Automática

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed-files.outputs.all_changed_files }}
      has_changes: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Verificar arquivos alterados
        id: changed-files
        uses: tj-actions/changed-files@v45.0.7
        with:
          dir_names: true
          json: true
          # Ignora a pasta do github e foca apenas nas pastas de matérias/períodos
          files_ignore: |
            .github/**
            *.md

  compile:
    needs: detect-changes
    # Só roda se houver mudanças válidas e a lista não estiver vazia
    if: needs.detect-changes.outputs.has_changes == 'true' && needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4.2.2

      - name: Compilar PDF da pasta ${{ matrix.directory }}
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: ${{ matrix.directory }}
          compiler: pdflatex
          args: "-interaction=nonstopmode -halt-on-error"


