name: Compilação de LaTeX Automática

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar arquivos alterados
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          dir_names: true
          json: true       

      - name: Filtrar pastas válidas
        id: set-matrix
        run: |
          CHANGED_DIRS='${{ steps.changed-files.outputs.all_changed_files }}'
          
          if [ "$CHANGED_DIRS" == "[]" ] || [ -z "$CHANGED_DIRS" ]; then
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          FILTERED=$(echo "$CHANGED_DIRS" | jq -c '[.[] | select(test("^\\.github") | not)]')

          if [ "$FILTERED" == "[]" ]; then
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "matrix=${FILTERED}" >> $GITHUB_OUTPUT
            echo "true=true" # Apenas para consistência interna
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  compile:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true' && needs.detect-changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Compilar PDF da pasta ${{ matrix.directory }}
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: ${{ matrix.directory }}
          compiler: pdflatex
          args: "-interaction=nonstopmode -halt-on-error"


