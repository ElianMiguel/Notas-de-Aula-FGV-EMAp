name: Compilação de LaTeX Automática

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ============================================================
  # 1. Detecta quais diretórios foram modificados
  # ============================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed-files.outputs.all_changed_files }}
      has_changes: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Configurar Git para nomes de arquivos em UTF-8
        run: git config --global core.quotepath false

      - name: Verificar arquivos alterados
        id: changed-files
        uses: tj-actions/changed-files@v45.0.7
        with:
          dir_names: true
          dir_names_exclude_current_dir: true
          matrix: true
          json: true
          escape_json: false
          safe_output: false
          # Ignora a pasta .github, arquivos Markdown e subpastas de imagens/capítulos
          files_ignore: |
            .github/**
            *.md
            **/imgs/**
            **/caps/**
            **/images/**

  # ============================================================
  # 2. Compila cada diretório que foi alterado
  # ============================================================
  compile:
    needs: detect-changes
    # Só executa se houver pelo menos um diretório alterado
    if: >
      needs.detect-changes.outputs.has_changes == 'true' &&
      needs.detect-changes.outputs.matrix != '[]' &&
      needs.detect-changes.outputs.matrix != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4.2.2

      - name: Criar atalho temporário para pastas com acento
        id: prepare-path
        env:
          RAW_DIR: ${{ matrix.directory }}
        run: |
          # Captura a variável de ambiente injetada de forma segura contra quebras de aspas
          ORIGINAL_DIR="$RAW_DIR"
          
          # Remove barras invertidas residuais e limpa escapes octais se houver
          ORIGINAL_DIR=$(printf '%b' "$ORIGINAL_DIR" 2>/dev/null || echo "$ORIGINAL_DIR")
          
          # Gera um nome limpo substituindo tudo que não for letra/número por underline
          CLEAN_DIR=$(echo "$ORIGINAL_DIR" | sed 's/[^A-Za-z0-9_]/_/g')
          
          # Se o nome limpo ficou vazio por algum motivo, usa um fallback seguro
          if [ -z "$CLEAN_DIR" ]; then CLEAN_DIR="latex_target_dir"; fi
          
          # Se o nome mudou, cria um link simbólico para enganar o compilador
          if [ "$ORIGINAL_DIR" != "$CLEAN_DIR" ]; then
            mkdir -p "$(dirname "$CLEAN_DIR")"
            ln -s "$PWD/$ORIGINAL_DIR" "$CLEAN_DIR"
            echo "compilation_dir=$CLEAN_DIR" >> $GITHUB_OUTPUT
          else
            echo "compilation_dir=$ORIGINAL_DIR" >> $GITHUB_OUTPUT
          fi

      - name: Compilar PDF da pasta
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: ${{ steps.prepare-path.outputs.compilation_dir }}
          compiler: pdflatex
          args: "-interaction=nonstopmode -halt-on-error"
