name: Compilação de LaTeX CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  compile-latex:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Compilar PDF do LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: "2º Período/Álgebra Linear"
          args: "-interaction=nonstopmode -halt-on-error"
